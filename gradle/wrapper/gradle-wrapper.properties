# distributionSha256Sum makes the wrapper verify the distribution it downloads before running
# it. Without it, the first thing a fresh clone does is execute a few hundred megabytes fetched
# over the network with nothing but TLS vouching for it. Taken from the official
# gradle-9.8.2-bin.zip.sha256 and confirmed against the bytes the URL actually serves.
#
# Note this line does not survive re-running the `wrapper` task -- that regenerates the file
# from scratch. Put it back if you ever bump the Gradle version.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
distributionSha256Sum=dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
